<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - MaqHub</title>

    <link rel="stylesheet" href="Styles/Globals.css">
    <link rel="stylesheet" href="Styles/admin.css">
    <link rel="stylesheet" href="Styles/perfil.css">
</head>

<body>

     <nav class="navbar">
        <div class="header-inner-content">
            
            <!-- 1. LOGO (Alinhado à Esquerda) -->
            <h1 class="logo">
                <span class="logo-special">Maq</span>Hub
            </h1>

            <!-- 2. LINKS (Centralizados Exatamente no Meio) -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
                <li><a href="login.html">Conta</a></li>
            </ul>

            <!-- 3. ÍCONES (Alinhados à Direita) -->
            <div class="nav-icon-container">
                <!-- Botão Lupa (Abre a pesquisa) -->
                <div id="search-toggle" title="Pesquisar" style="cursor: pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>

                <!-- Carrinho -->
                <a href="carrinho.html">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </a>

                <!-- Menu Mobile -->
                <div class="menu-bttn">
                    <img src="Icons/menu.png" alt="menu" style="width: 30px;">
                </div>
            </div>
        </div>

        <!-- BARRA DE PESQUISA (Começa oculta e empurra a navbar para baixo ao abrir) -->
        <div class="search-bar-container" id="search-container">
            <div class="search-input-wrapper">
                <select id="search-filter" class="search-filter">
                    <option value="all">Categorias</option>
                    <option value="caminhoes">Caminhões</option>
                    <option value="agricola">Agrícola</option>
                </select>
                <input type="text" id="search-input" class="search-input" placeholder="O que procura?">
                <button id="search-btn" class="search-btn-go" type="submit">IR</button>
            </div>
            <div id="search-results"></div>
        </div>
    </nav>
    <main class="admin-container perfil-container">
        <h1>Meu Perfil</h1>

        <section class="form-admin" id="dados-usuario">
            <h2>Meus Dados</h2>
            <div class="input-grupo">
                <label>Usuário:</label>
                <p id="user-usuario"></p>
            </div>
            <div class="input-grupo">
                <label>Email:</label>
                <p id="user-email"></p>
            </div>
            <div class="input-grupo">
                <label>Telefone:</label>
                <p id="user-telefone"></p>
            </div>
        </section>

        <h2>Anunciar Novo Produto</h2>
        <form id="product-form" class="form-admin">
            <input type="text" id="nome" placeholder="Nome do Produto/Máquina" required>
            <input type="text" id="categoria" placeholder="Categoria (Ex: Trator, Colheitadeira)" required>
            <input type="number" id="preco" placeholder="Preço (use 0 se for 'a combinar')" required>
            <input type="text" id="imagem" placeholder="URL da Imagem Principal" required>
            <textarea id="descricao" placeholder="Descrição completa do seu anúncio" required></textarea>

            <button type="submit" class="cta-button">Publicar Anúncio</button>
        </form>

    </main>

    <footer class="background"></footer>

    <script src="JS/script.js"></script>
    <script src="JS/perfil.js"></script>
</body>

</html>
