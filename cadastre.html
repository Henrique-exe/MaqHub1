<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Styles/cadastre.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/logofundo.png" type="image/x-icon">
    <title>Registra-se - MaqHub</title>
</head>

<body>

    <main class="login-wrapper">

        <div class="login-image">
            </div>

        <div class="login-form">
            <form>
                <h1>Crie sua Conta</h1>

                <p class="subtitle">É rápido.</p>

                <div class="input-box">
                    <input placeholder="Email" type="email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input placeholder="Usuário" type="text" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input placeholder="Senha" type="password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="input-box">
                    <input placeholder="Confirme sua senha" type="password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="input-box">
                    <input placeholder="Telefone" type="tel" required>
                    <i class='bx bxs-phone'></i>
                </div>
                
                <button type="submit" class="login-btn">
                    Registrar
                </button>
            </form>
        </div>

    </main>

    <script src="JS/register.js"></script>
    <script src="JS/login.js"></script>
    <script src="JS/script.js"></script>
</body>

</html>
